[package]
name = "harsh-ids"
version = "0.1.0"
edition = "2024"
authors = ["wulu007 <dabaobeix@gmail.com>"]
description = "Python bindings for harsh, a Hashids implementation in Rust"
repository = "https://github.com/wulu007/harsh-ids"
homepage = "https://github.com/wulu007/harsh-ids"
readme = "README.md"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
# The importable module is named `harsh_ids`, matching the distribution name
# so that pickle, repr, and class lookup all resolve to the same module.
name = "harsh_ids"
crate-type = ["cdylib"]

[dependencies]
harsh = "0.2.2"
pyo3 = { version = "0.29", features = ["abi3-py39", "extension-module"] }
