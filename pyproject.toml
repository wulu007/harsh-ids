[build-system]
requires = ["maturin>=1.15,<2.0"]
build-backend = "maturin"

[project]
name = "harsh-ids"
description = "Python bindings for harsh, a Hashids implementation in Rust"
authors = [{ name = "wulu007", email = "dabaobeix@gmail.com" }]
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["hashids", "hashid", "encoder", "id", "rust"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/wulu007/harsh-ids"
Repository = "https://github.com/wulu007/harsh-ids"
Issues = "https://github.com/wulu007/harsh-ids/issues"
Changelog = "https://github.com/wulu007/harsh-ids/releases"

[tool.maturin]
include = [{ path = "harsh_ids.pyi", format = ["sdist", "wheel"] }]
exclude = ["dist/*"]

[tool.maturin.generate-ci.github]
pytest = true
trusted-publishing = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = ["pytest>=8.3.5"]
bench = ["hashids>=1.3.1", "pytest-benchmark>=5.1.0", "pytest-codspeed>=3.0"]
